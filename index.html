<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e50914">
<title>Gerador de Sensi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:28px 18px 40px}
h1{font-size:30px;margin:0 0 8px;text-align:center} .sub{text-align:center;color:#aaa;margin-bottom:24px}
.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;color:#bbb;font-size:14px;margin:0 0 7px}
select,button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px}
select{background:#222;color:#fff;margin-bottom:16px}
button{background:#e50914;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
button.secondary{background:#242424}.result{display:grid;gap:9px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;background:#202020;padding:14px;border-radius:12px}
.value{color:#ff3340;font-size:21px;font-weight:800}
.note{font-size:12px;color:#777;text-align:center;line-height:1.5;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 GERADOR DE SENSI</h1>
<div class="sub">Crie uma configuração personalizada para seu estilo.</div>

<div class="card">
<label>Celular</label>
<select id="phone">
<option>iPhone</option><option>Samsung</option><option>Xiaomi</option><option>Motorola</option><option>Outro</option>
</select>
<label>Estilo de jogo</label>
<select id="style">
<option>Capa</option><option>Equilibrado</option><option>Rush</option><option>Precisão</option>
</select>
<button onclick="generate()">GERAR NOVA SENSI</button>
</div>

<div class="card">
<div class="result" id="result"></div>
<button class="secondary" onclick="copyResult()">📋 COPIAR CONFIGURAÇÃO</button>
</div>

<div class="note">As configurações são sugestões e podem precisar de ajustes dentro do jogo.</div>
</div>

<script>
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function generate(){
 const style=document.getElementById('style').value;
 let min=155,max=200;
 if(style==='Rush'){min=165;max=200}
 if(style==='Precisão'){min=120;max=175}
 if(style==='Equilibrado'){min=140;max=190}
 const data=[
 ['Geral',rand(min,max)],['Red Dot',rand(min,max)],
 ['Mira 2x',rand(120,190)],['Mira 4x',rand(100,180)],
 ['AWM',rand(60,120)],['Olhadinha',rand(90,150)]
 ];
 document.getElementById('result').innerHTML=data.map(x=>`<div class="row"><span>${x[0]}</span><span class="value">${x[1]}</span></div>`).join('');
}
function copyResult(){
 const rows=[...document.querySelectorAll('.row')];
 if(!rows.length){generate();return}
 const text='GERADOR DE SENSI\\n'+rows.map(r=>r.innerText.replace('\\n',': ')).join('\\n');
 navigator.clipboard?.writeText(text);
 alert('Configuração copiada!');
}
generate();
</script>
</body>
</html>
